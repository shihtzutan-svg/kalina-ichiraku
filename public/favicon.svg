<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- 銀河の中心の光（発光グラデーション） -->
    <radialGradient id="galaxy-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#ffb7ff" />
      <stop offset="100%" stop-color="#a3e2ff" stop-opacity="0" />
    </radialGradient>
    
    <!-- 渦の腕（ピンク〜ブルーへのグラデーション） -->
    <linearGradient id="arm-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb7ff" />
      <stop offset="100%" stop-color="#a3e2ff" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="arm-grad-2" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#a3e2ff" />
      <stop offset="100%" stop-color="#ffb7ff" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- 背景（ダーク宇宙カラー） -->
  <rect width="64" height="64" rx="16" fill="#0d0b18"/>
  <rect width="64" height="64" rx="16" fill="none" stroke="rgba(255,183,255,0.25)" stroke-width="1.5"/>

  <!-- 銀河の渦の腕（螺旋） -->
  <g stroke-linecap="round" fill="none">
    <!-- 渦アーム 1 -->
    <path d="M 32 32 C 32 25, 42 22, 46 28 C 51 35, 42 45, 32 47 C 18 49, 12 37, 16 25 C 20 13, 37 8, 50 14" 
          stroke="url(#arm-grad-1)" stroke-width="3.5" opacity="0.95" />
    
    <!-- 渦アーム 2（対角） -->
    <path d="M 32 32 C 32 39, 22 42, 18 36 C 13 29, 22 19, 32 17 C 46 15, 52 27, 48 39 C 44 51, 27 56, 14 50" 
          stroke="url(#arm-grad-2)" stroke-width="3.5" opacity="0.95" />
  </g>

  <!-- 銀河の中心核（眩しい光） -->
  <circle cx="32" cy="32" r="14" fill="url(#galaxy-core)" />
  <circle cx="32" cy="32" r="3" fill="#ffffff" />

  <!-- 周囲にちりばめられた星々 -->
  <circle cx="16" cy="18" r="1" fill="#ffb7ff" opacity="0.8" />
  <circle cx="48" cy="46" r="1" fill="#a3e2ff" opacity="0.8" />
  <circle cx="46" cy="16" r="1.5" fill="#ffffff" opacity="0.9" />
  <circle cx="18" cy="48" r="1.2" fill="#ffffff" opacity="0.7" />
  
  <!-- 中央の輝きアクセント -->
  <path d="M32 20 C32 28, 30 32, 32 44 C32 32, 34 28, 32 20 Z" fill="#ffffff" opacity="0.6"/>
</svg>
